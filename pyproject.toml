[project]
name = "argussight"
version = "0.3.2"
description = "An addition to MXCuBEWeb enabling simultaneous video streaming and distributed computer vision tasks."
authors = [{name = "Yan Walesch", email = "yan.walesch@esrf.fr"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["MXCuBEWeb", "video streaming", "computer vision", "multistream", "process management"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "colorlog>=6.9.0,<7",
    "Flask>=3.1.3,<4",
    "grpcio==1.70.0",
    "grpcio-tools==1.70.0",
    "mxcube-video-streamer>=1.11.0,<2",
    "numpy>=1.26.0,<2",
    "opencv-python==4.10.0.84",
    "pillow>=13.0.0,<14",
    "pydantic>=2.13,<3",
    "python-levenshtein>=0.25.1,<0.26",
    "pyyaml>=6.0.1,<7",
    "redis==4.6.0",
    "websocket-client>=1.8.0,<2",
]

[project.urls]
homepage = "https://github.com/mxcube/argussight"
repository = "https://github.com/mxcube/argussight"
documentation = "https://mxcube.github.io/argussight/"

[project.scripts]
argussight = "argussight.main:run"
stream-layer = "argussight.streamsproxy:run"

[dependency-groups]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-macros-plugin>=1.3.7,<2",
]
dev = [
    "isort>=5.13.2,<6",
    "pre-commit>=3.8.0,<4",
    { include-group = "docs" },
]

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core>=2.5,<3"]
build-backend = "poetry.core.masonry.api"
